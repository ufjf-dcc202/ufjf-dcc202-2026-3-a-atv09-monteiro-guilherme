<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo 02</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul{
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul > li{
            border: 1px solid green;
            background-color: lightgreen;
        }

        .descontructed-pancake{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .descontructed-pancake > *{
            flex: 1 1 120px;
        }
    </style>
</head>

<body>
    <main>
        <article>
            <ul class="descontructed-pancake">
                <li>Huginho</li>
                <li>Zezinho</li>
                <li>Luizinho</li>
                <li>Betina</li>
            </ul>
        </article>
        
    </main>
</body>
</html>
